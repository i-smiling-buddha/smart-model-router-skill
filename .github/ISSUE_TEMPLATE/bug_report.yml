name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, what you got. Remove any API keys or secrets.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `smr doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Claude Code, OpenCode, Codex, Other MCP host, CLI only, HTTP API]
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux]
    validations:
      required: true
